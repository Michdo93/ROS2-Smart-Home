name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        distro: [jazzy, lyrical]
    container: ros:${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/ROS2-Smart-Home
      - name: Abhängigkeiten und Begleit-Repos
        run: |
          apt-get update
          apt-get install -y git python3-pip python3-pytest python3-numpy \
            python3-opencv python3-zmq \
            ros-${{ matrix.distro }}-tf2-ros ros-${{ matrix.distro }}-turtlesim \
            ros-${{ matrix.distro }}-diagnostic-msgs
          pip3 install --break-system-packages python-openhab-rest-client
          cd src
          git clone --depth 1 https://github.com/Michdo93/ros2_openhab_ws.git
          git clone --depth 1 https://github.com/Michdo93/ROS2-Kinect-v1-Xbox-360.git
          git clone --depth 1 https://github.com/Michdo93/ROS2-Kinect-v2-Xbox-One.git
      - name: Bauen
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --packages-skip openhab_bridge_cpp --event-handlers console_direct+
      - name: Tests
        shell: bash
        run: cd src/ROS2-Smart-Home/src/sh_hand && python3 -m pytest -q test
      - name: Kapitel 6 (QoS) und 17 (Hand erkannt, Simulation)
        shell: bash
        run: |
          source install/setup.bash
          timeout -k 5 30 ros2 run sh_grundlagen qos_demo
          timeout -k 5 40 ros2 run kinect_v1_ros2 kinect_v1_node --ros-args \
            -r __ns:=/kinect_v1 -p simulate:=true &
          timeout -k 5 40 ros2 run sh_hand hand_detektor &
          timeout -k 5 35 ros2 topic echo --once /hand_erkannt --qos-durability transient_local
          kill %1 %2 2>/dev/null || true
