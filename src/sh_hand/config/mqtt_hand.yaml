# Kapitel 19: "Hand erkannt" über MQTT, zum Beispiel für Home Assistant
#   (homeassistant/hand.yaml). Der Detektor bleibt derselbe – nur der Weg
#   ins Smart Home ist ein anderer.
/**/*:
  ros__parameters:
    broker:
      host: localhost
      port: 1883
      tls:
        enabled: false
    client:
      id: ros2_hand
      clean_session: true
      keep_alive_interval: 60.0
      max_inflight: 10
    bridge:
      ros2mqtt:
        ros_topics:
          - /hand_erkannt
        /hand_erkannt:                       # Zustand: "true" oder "false"
          mqtt_topic: ros/flur/hand
          ros_type: std_msgs/msg/Bool
          primitive: true
          advanced:
            ros:
              qos:
                durability: transient_local
                reliability: reliable
            mqtt:
              retained: true
