# Kapitel 20: gemeinsame Umgebung für alle ROS-2-Dienste eines Rechners
# (systemd EnvironmentFile – auf jedem Rechner des Hauses gleich, außer den Zugangsdaten)
ROS_DOMAIN_ID=7
ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
RMW_IMPLEMENTATION=rmw_fastrtps_cpp
OPENHAB_URL=http://openhab:8080
# OPENHAB_TOKEN nur auf dem Rechner, auf dem die Brücke läuft (Datei: chmod 600)
